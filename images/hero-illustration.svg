<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" role="img" aria-label="Цифрлық веб-шешімдер иллюстрациясы">
  <defs>
    <linearGradient id="bgCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="12" y="12" width="536" height="376" rx="28" fill="url(#bgCard)"/>
  <circle cx="490" cy="70" r="46" fill="#BFDBFE" opacity="0.55"/>
  <circle cx="72" cy="340" r="36" fill="#BAE6FD" opacity="0.6"/>

  <!-- Browser Window -->
  <g filter="url(#shadow)">
    <rect x="48" y="46" width="420" height="278" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <path d="M48 62 Q48 46 64 46 L452 46 Q468 46 468 62 L468 82 L48 82 Z" fill="#0F172A"/>
    <circle cx="70" cy="64" r="5" fill="#EF4444"/>
    <circle cx="88" cy="64" r="5" fill="#F59E0B"/>
    <circle cx="106" cy="64" r="5" fill="#22C55E"/>
    <rect x="130" y="55" width="210" height="18" rx="9" fill="#1E293B"/>
    <text x="148" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#94A3B8">https://qazaqtech.kz</text>

    <!-- Inside Browser: Hero Card + Metrics -->
    <rect x="70" y="100" width="235" height="92" rx="12" fill="url(#accentBlue)"/>
    <text x="88" y="130" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">HTML5 / CSS3 / JS</text>
    <text x="88" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#E0F2FE">Бейімді цифрлық платформа</text>
    <rect x="88" y="162" width="84" height="20" rx="10" fill="#FFFFFF"/>
    <text x="104" y="176" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#1D4ED8">Іске қосу</text>

    <!-- Performance Gauge Card -->
    <rect x="320" y="100" width="128" height="92" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="384" cy="140" r="24" fill="none" stroke="#E2E8F0" stroke-width="6"/>
    <circle cx="384" cy="140" r="24" fill="none" stroke="#10B981" stroke-width="6" stroke-dasharray="142 151" stroke-linecap="round" transform="rotate(-90 384 140)"/>
    <text x="384" y="144" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">99%</text>
    <text x="384" y="180" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#475569">Lighthouse</text>

    <!-- Analytics Bars -->
    <rect x="70" y="208" width="378" height="96" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="86" y="228" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Жоба өнімділігі және конверсия</text>
    <rect x="86" y="264" width="28" height="26" rx="4" fill="#93C5FD"/>
    <rect x="128" y="252" width="28" height="38" rx="4" fill="#60A5FA"/>
    <rect x="170" y="242" width="28" height="48" rx="4" fill="#3B82F6"/>
    <rect x="212" y="256" width="28" height="34" rx="4" fill="#60A5FA"/>
    <rect x="254" y="232" width="28" height="58" rx="4" fill="#2563EB"/>
    <rect x="296" y="224" width="28" height="66" rx="4" fill="#1D4ED8"/>
    <rect x="338" y="218" width="28" height="72" rx="4" fill="#0EA5E9"/>
    <rect x="380" y="212" width="28" height="78" rx="4" fill="#0284C7"/>
  </g>

  <!-- Mobile Preview Overlay -->
  <g filter="url(#shadow)" transform="translate(14, 10)">
    <rect x="396" y="176" width="122" height="196" rx="18" fill="#0F172A"/>
    <rect x="403" y="188" width="108" height="172" rx="12" fill="#FFFFFF"/>
    <rect x="441" y="181" width="32" height="4" rx="2" fill="#334155"/>
    <rect x="413" y="200" width="88" height="42" rx="8" fill="url(#accentBlue)"/>
    <text x="457" y="220" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF">Mobile Ready</text>
    <text x="457" y="233" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#E0F2FE">375px — 1440px</text>
    <rect x="413" y="252" width="88" height="22" rx="6" fill="#F1F5F9"/>
    <rect x="413" y="282" width="88" height="22" rx="6" fill="#F1F5F9"/>
    <rect x="413" y="312" width="88" height="36" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="457" y="334" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700" fill="#1D4ED8">WCAG AAA</text>
  </g>
</svg>
